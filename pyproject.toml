[project]
name = "jev-ultrafast"
version = "0.1.0"
description = "A browser agent that chooses instead of generating."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "browser-harness==0.1.13",
    "browser-use>=0.11.13",
    "faster-whisper>=1.2.1",
    "httpx[http2]>=0.28,<1",
    "laya>=0.3.4",
    "mcp>=2.2.0",
    "piper-tts>=1.8.0",
    "psutil>=7",
    "pydantic-settings>=2.15.0",
    "pywinauto>=0.6.9",
    "sounddevice>=0.5.6",
    "torch>=2.14.0",
]

# CUDA build of torch (RTX 2060 / sm_75). PyPI only ships the CPU wheel on
# Windows, so torch is pinned to the pytorch cu126 index.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[project.scripts]
jev = "jev_ultrafast.demo:main"
jev-cu = "laya_cu.jev_cu:main"
laya-ask = "laya_ask:main"
laya-browse = "laya_browse:main"
laya-cu = "laya_cu.laya_cu:main"
laya-console = "laya_console:main"
laya-terminal = "laya_terminal:main"
laya-voice = "laya_cu.laya_voice:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1", "pillow>=11,<13"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
